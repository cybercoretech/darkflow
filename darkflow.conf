schema = "darkflow.project/v1"
name = "Darkflow"
description = "Local project change control, review, and verification."
default_branch = "main"

[workflow]
provider = "codex"
mode = "isolated-worktree"
require_clean_worktree = true
require_review_before_apply = true
allow_network = false
telemetry = "local-only"

[scope]
include = ["src/**", "src-tauri/**", "docs/**", "*.md", "*.toml", "*.json"]
exclude = ["target/**", "node_modules/**", "dist/**", ".git/**", ".darkflow/**", "*.lock"]
protected = [".github/workflows/**", "Cargo.lock", "package-lock.json"]

[[checks]]
id = "frontend-build"
label = "Frontend typecheck + production build"
command = "npm run check"
timeout_seconds = 300
required = true

[[checks]]
id = "rust-tests"
label = "Rust tests"
command = "cargo test --manifest-path src-tauri/Cargo.toml"
timeout_seconds = 900
required = true

[[checks]]
id = "diff-hygiene"
label = "Whitespace and conflict-marker check"
command = "git diff --check"
timeout_seconds = 60
required = true
