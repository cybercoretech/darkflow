[package]
name = "darkflow"
version = "0.1.0"
description = "Local project change control and review workbench"
authors = ["Cybercore Systems"]
edition = "2024"

[lib]
name = "darkflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
resvg = { version = "0.48.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "process", "time", "sync", "macros", "rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
taffy = { version = "0.10.1", optional = true }

[features]
default = []
asset-tools = ["dep:image", "dep:resvg"]
native-layout-experiment = ["dep:taffy"]
custom-protocol = ["tauri/custom-protocol"]
